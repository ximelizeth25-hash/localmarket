<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />

  <!-- Inner Vibrant Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Border -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />

  <!-- Center Storefront Icon -->
  <g transform="translate(106, 126)" fill="#ffffff">
    <!-- Awning / Roof -->
    <path d="M150 20 L280 110 L20 110 Z" fill="#ffffff" />
    <path d="M15 110 Q20 135 45 135 Q70 135 75 110 Q80 135 105 135 Q130 135 135 110 Q140 135 165 135 Q190 135 195 110 Q200 135 225 135 Q250 135 255 110 Q260 135 285 135 Q300 135 300 110" fill="#f0fdf4" opacity="0.9" />

    <!-- Columns -->
    <rect x="42" y="145" width="30" height="95" rx="6" fill="#f0fdf4" />
    <rect x="135" y="145" width="30" height="95" rx="6" fill="#f0fdf4" />
    <rect x="228" y="145" width="30" height="95" rx="6" fill="#f0fdf4" />

    <!-- Foundation / Base -->
    <rect x="18" y="245" width="264" height="26" rx="8" fill="#ffffff" />
  </g>
</svg>
