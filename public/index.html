<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LocalMarket</title>
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#195618">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LocalMarket">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: {
                            DEFAULT: '#195618',
                            hover: '#134412',
                            active: '#0f350e'
                        },
                        moss: {
                            DEFAULT: '#5E7824',
                            hover: '#4e641e'
                        },
                        foliage: {
                            DEFAULT: '#5C8754'
                        },
                        sage: {
                            DEFAULT: '#93A981',
                            light: '#A8C1A0'
                        },
                        limeSoft: {
                            DEFAULT: '#9BBB54'
                        },
                        leaf: {
                            DEFAULT: '#88BD79'
                        },
                        matcha: {
                            DEFAULT: '#C5DB9E',
                            subtle: '#f4f8ed',
                            light: '#eef5e4'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .ambient-glow {
            background: radial-gradient(circle at 50% 10%, rgba(197, 219, 158, 0.35), transparent 50%),
                        radial-gradient(circle at 85% 85%, rgba(168, 193, 160, 0.25), transparent 45%),
                        radial-gradient(circle at 15% 75%, rgba(25, 86, 24, 0.08), transparent 40%);
        }
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .card-pop {
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-[#f7faf4] ambient-glow flex flex-col justify-center items-center p-4 sm:p-6 text-slate-800 antialiased relative selection:bg-[#195618] selection:text-white">

    <!-- Tarjeta Principal de Login -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-[#195618]/10 border border-[#93A981]/50 p-8 sm:p-10 card-pop relative overflow-hidden z-10">
        
        <!-- Acento decorativo superior con la paleta natural -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#195618] via-[#5C8754] to-[#88BD79]"></div>

        <!-- Encabezado / Branding -->
        <div class="text-center space-y-3 mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#195618] to-[#5C8754] items-center justify-center text-white shadow-lg shadow-[#195618]/25 mb-1 transform hover:scale-105 transition-all">
                <i class="fa-solid fa-store text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-[#195618] tracking-tight">
                    Local<span class="text-[#5E7824]">Market</span>
                </h1>
                <p class="text-xs sm:text-sm text-slate-600 font-medium mt-1">
                    Comercio local y gestión sostenible
                </p>
            </div>
        </div>

        <!-- Mensaje de Retroalimentación (Alerta) -->
        <div id="alertBox" class="hidden mb-6 p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2.5 transition-all duration-300">
            <i id="alertIcon" class="fa-solid text-sm flex-shrink-0"></i>
            <span id="alertMessage" class="flex-1 leading-snug"></span>
        </div>

        <!-- Formulario de Acceso -->
        <form id="loginForm" class="space-y-4">
            
            <!-- Campo: Usuario / Correo -->
            <div class="relative flex items-center">
                <span class="absolute left-3.5 text-[#5C8754] text-sm">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    placeholder="Usuario o correo"
                    class="w-full pl-10 pr-4 py-3 text-sm rounded-xl border border-[#93A981]/60 bg-[#C5DB9E]/10 hover:bg-white focus:bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#5C8754] focus:border-[#5C8754] transition-all font-medium placeholder-slate-400"
                >
            </div>

            <!-- Campo: Contraseña con Toggle de Visibilidad -->
            <div class="relative flex items-center">
                <span class="absolute left-3.5 text-[#5C8754] text-sm">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="Contraseña"
                    class="w-full pl-10 pr-11 py-3 text-sm rounded-xl border border-[#93A981]/60 bg-[#C5DB9E]/10 hover:bg-white focus:bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#5C8754] focus:border-[#5C8754] transition-all font-medium placeholder-slate-400"
                >
                <button 
                    type="button" 
                    id="togglePasswordBtn" 
                    title="Mostrar u ocultar contraseña"
                    class="absolute right-3 text-[#93A981] hover:text-[#195618] p-1 rounded-lg focus:outline-none transition-all"
                >
                    <i id="toggleEyeIcon" class="fa-solid fa-eye text-sm"></i>
                </button>
            </div>

            <!-- Botón de Envío: Primario / CTA (#195618) -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-[#195618] hover:bg-[#134412] active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl text-sm transition-all duration-200 shadow-lg shadow-[#195618]/25 flex items-center justify-center space-x-2 cursor-pointer mt-2"
            >
                <span id="btnText">Iniciar Sesión</span>
                <i id="btnIcon" class="fa-solid fa-arrow-right text-xs"></i>
                <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

    </div>

    <!-- Footer Copyright -->
    <p class="text-xs text-slate-500 mt-6 text-center font-medium">
        &copy; 2026 LocalMarket &bull; Sistema de Gestión y Comercio Electrónico
    </p>

    <!-- Script de Lógica Frontend & Backend -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const toggleEyeIcon = document.getElementById('toggleEyeIcon');
        const alertBox = document.getElementById('alertBox');
        const alertIcon = document.getElementById('alertIcon');
        const alertMessage = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        // Alternar Visibilidad de Contraseña
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleEyeIcon.className = isPassword ? 'fa-solid fa-eye-slash text-sm' : 'fa-solid fa-eye text-sm';
        });

        // Función Auxiliar para Mostrar Alertas
        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-200', 'bg-[#C5DB9E]/40', 'text-[#195618]', 'border-[#88BD79]', 'bg-[#A8C1A0]/30', 'border-[#93A981]', 'border');
            
            if (type === 'success') {
                alertBox.classList.add('bg-[#C5DB9E]/40', 'text-[#195618]', 'border', 'border-[#88BD79]');
                alertIcon.className = 'fa-solid fa-circle-check text-[#195618] text-sm flex-shrink-0';
            } else if (type === 'info') {
                alertBox.classList.add('bg-[#A8C1A0]/30', 'text-[#195618]', 'border', 'border-[#93A981]');
                alertIcon.className = 'fa-solid fa-circle-info text-[#5C8754] text-sm flex-shrink-0';
            } else {
                alertBox.classList.add('bg-rose-50', 'text-rose-700', 'border', 'border-rose-200');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-rose-600 text-sm flex-shrink-0';
            }

            alertMessage.textContent = msg;
        }

        // Estado de Carga en Botón
        function setLoading(loading) {
            if (loading) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Verificando...';
                btnIcon.classList.add('hidden');
                btnSpinner.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Iniciar Sesión';
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }

        // Envío del Formulario e Integración con /api/login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            setLoading(true);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.user) {
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                    } else {
                        localStorage.setItem('currentUser', JSON.stringify({ nombre: username, nombre_rol: 'Administrador' }));
                    }
                    showAlert('¡Inicio de sesión exitoso! Redirigiendo al panel...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard.html';
                    }, 600);
                } else {
                    setLoading(false);
                    showAlert(data.message || 'Credenciales inválidas. Verifica tu usuario o contraseña.');
                }
            } catch (error) {
                console.warn('Conexión con backend no disponible, evaluando credenciales locales:', error);
                const lowerUser = (username || '').toLowerCase().trim();
                if ((lowerUser === 'admin' || lowerUser === 'admin@localmarket.com') && (password === '1234' || password === '123')) {
                    const fallbackUser = { id_usuario: 1, id_rol: 1, nombre: 'Administrador', correo: 'admin@localmarket.com', nombre_rol: 'Administrador', foto_perfil: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=120' };
                    localStorage.setItem('currentUser', JSON.stringify(fallbackUser));
                    showAlert('¡Inicio de sesión en modo local / offline exitoso!', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                    return;
                }
                if ((lowerUser === 'gisela' || lowerUser === 'ar230111983@arandas.tecmm.edu.mx') && (password === '4321' || password === '1234')) {
                    const fallbackUser = { id_usuario: 2, id_rol: 2, nombre: 'Gisela', correo: 'ar230111983@arandas.tecmm.edu.mx', nombre_rol: 'Vendedor', foto_perfil: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120' };
                    localStorage.setItem('currentUser', JSON.stringify(fallbackUser));
                    showAlert('¡Inicio de sesión en modo local / offline exitoso!', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                    return;
                }
                setLoading(false);
                showAlert('Error de comunicación con el servidor. Verifica que el servidor en http://localhost:3000 esté iniciado.');
            }
        });
    </script>
    <script src="js/pwa.js"></script>
</body>
</html>
