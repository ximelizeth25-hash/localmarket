<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Iniciar Sesión - LocalMarket</title>
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#195618">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/icons/favicon.png">

    <!-- Tailwind CSS (CDN Oficial) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#195618',
                        moss: '#5E7824',
                        foliage: '#5C8754',
                        sage: '#93A981',
                        limeSoft: '#9BBB54',
                        leaf: '#88BD79',
                        sageLight: '#A8C1A0',
                        matcha: '#C5DB9E'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .ambient-glow {
            background: radial-gradient(circle at 50% 0%, rgba(197, 219, 158, 0.45) 0%, rgba(247, 250, 244, 0.95) 70%, #f7faf4 100%);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.96) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .card-pop {
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-[#f7faf4] ambient-glow flex flex-col justify-center items-center p-4 sm:p-6 text-slate-800 antialiased relative selection:bg-[#195618] selection:text-white">

    <!-- Tarjeta Principal de Login -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-[#195618]/10 border border-[#93A981]/50 p-8 sm:p-10 card-pop relative overflow-hidden z-10">
        
        <!-- Acento decorativo superior con la paleta natural -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#195618] via-[#5C8754] to-[#88BD79]"></div>

        <!-- Encabezado / Branding -->
        <div class="text-center space-y-3 mb-6">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#195618] to-[#5C8754] items-center justify-center text-white shadow-lg shadow-[#195618]/25 mb-1 transform hover:scale-105 transition-all">
                <i class="fa-solid fa-store text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-[#195618] tracking-tight">
                    Local<span class="text-[#5E7824]">Market</span>
                </h1>
            </div>
        </div>

        <!-- Mensaje de Retroalimentación (Alerta) -->
        <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2.5 transition-all duration-300">
            <i id="alertIcon" class="fa-solid text-sm flex-shrink-0"></i>
            <span id="alertMessage" class="flex-1 leading-snug"></span>
        </div>

        <!-- Formulario de Acceso Unificado -->
        <form id="loginForm" class="space-y-4">
            
            <!-- Selector de Rol / Tipo de Acceso -->
            <div>
                <label for="rol-login" class="block text-xs font-bold text-slate-700 uppercase mb-1.5 flex items-center space-x-1.5">
                    <i class="fa-solid fa-users-gear text-[#5C8754]"></i>
                    <span>Tipo de Acceso</span>
                </label>
                <div class="relative flex items-center w-full" style="position: relative; display: flex; align-items: center; width: 100%;">
                    <span id="rolIcon" class="absolute left-3.5 text-[#2D6A4F] text-sm pointer-events-none" style="position: absolute; left: 0.875rem; color: #2D6A4F; pointer-events: none; z-index: 10;">
                        <i class="fa-solid fa-crown"></i>
                    </span>
                    <select 
                        id="rol-login" 
                        name="rol-login"
                        class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-[#93A981]/60 bg-[#C5DB9E]/10 hover:bg-white focus:bg-white text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-[#5C8754] focus:border-[#5C8754] transition-all cursor-pointer"
                        style="padding-left: 2.5rem;"
                    >
                        <option value="Administrador" selected>Administrador</option>
                        <option value="Socio">Socio</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                </div>
            </div>

            <!-- Campo Dinámico: Identificador (Correo / Usuario o Número de Socio) -->
            <div id="identificadorContainer" class="space-y-1">
                <label id="identificadorLabel" class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Correo o Usuario
                </label>
                <div class="relative flex items-center">
                    <span id="identificadorIcon" class="absolute left-3.5 text-[#5C8754] text-sm">
                        <i class="fa-solid fa-user-shield"></i>
                    </span>
                    <input 
                        type="text" 
                        id="identificador" 
                        name="identificador" 
                        required 
                        placeholder="admin@localmarket.com o admin"
                        class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-[#93A981]/60 bg-[#C5DB9E]/10 hover:bg-white focus:bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#5C8754] focus:border-[#5C8754] transition-all font-medium placeholder-slate-400"
                    >
                </div>
            </div>

            <!-- Campo Dinámico: Contraseña (Se oculta en modo Cliente) -->
            <div id="passwordContainer" class="space-y-1">
                <label id="passwordLabel" class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Contraseña
                </label>
                <div style="position: relative; display: flex; align-items: center; width: 100%;">
                    <span class="absolute left-3.5 text-[#5C8754] text-sm pointer-events-none" style="position: absolute; left: 0.875rem;">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Contraseña"
                        class="w-full pl-10 pr-11 py-2.5 text-sm rounded-xl border border-[#93A981]/60 bg-[#C5DB9E]/10 hover:bg-white focus:bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#5C8754] focus:border-[#5C8754] transition-all font-medium placeholder-slate-400"
                        style="padding-right: 2.5rem;"
                    >
                    <button 
                        type="button" 
                        id="togglePasswordBtn" 
                        aria-label="Mostrar u ocultar contraseña"
                        title="Mostrar u ocultar contraseña"
                        onclick="togglePasswordVisibility('password', this)"
                        style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; color: #2D6A4F; display: flex; align-items: center; justify-content: center; padding: 0.25rem;"
                    >
                        <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <svg class="eye-closed hidden w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Botón de Envío: Primario / CTA (#195618) -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-[#195618] hover:bg-[#134412] active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl text-sm transition-all duration-200 shadow-lg shadow-[#195618]/25 flex items-center justify-center space-x-2 cursor-pointer mt-3"
            >
                <span id="btnText">Iniciar Sesión</span>
                <i id="btnIcon" class="fa-solid fa-arrow-right text-xs"></i>
                <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

    </div>

    <!-- Script de Lógica Frontend & Backend -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const rolLogin = document.getElementById('rol-login');
        const rolIcon = document.getElementById('rolIcon');
        const identificadorInput = document.getElementById('identificador');
        const identificadorLabel = document.getElementById('identificadorLabel');
        const identificadorIcon = document.getElementById('identificadorIcon');
        const passwordContainer = document.getElementById('passwordContainer');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const toggleEyeIcon = document.getElementById('toggleEyeIcon');
        const alertBox = document.getElementById('alertBox');
        const alertIcon = document.getElementById('alertIcon');
        const alertMessage = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        // Alternancia Dinámica según el Rol Seleccionado
        function actualizarCamposPorRol() {
            const rol = rolLogin.value;
            alertBox.classList.add('hidden');

            if (rol === 'Administrador') {
                identificadorLabel.textContent = 'Correo o Usuario';
                if (rolIcon) rolIcon.innerHTML = '<i class="fa-solid fa-crown"></i>';
                identificadorInput.type = 'text';
                identificadorInput.placeholder = 'admin@localmarket.com o admin';
                identificadorInput.value = '';
                identificadorIcon.innerHTML = '<i class="fa-solid fa-user-shield"></i>';

                passwordContainer.classList.remove('hidden');
                passwordInput.required = true;
                passwordInput.value = '';

                btnText.textContent = 'Iniciar Sesión como Administrador';
            } else if (rol === 'Socio') {
                identificadorLabel.textContent = 'NÚM. DE SOCIO';
                if (rolIcon) rolIcon.innerHTML = '<i class="fa-solid fa-store"></i>';
                identificadorInput.type = 'number';
                identificadorInput.min = '1';
                identificadorInput.placeholder = '';
                identificadorInput.value = '';
                identificadorIcon.innerHTML = '<i class="fa-solid fa-id-badge"></i>';

                passwordContainer.classList.remove('hidden');
                passwordInput.required = true;
                passwordInput.value = '';

                btnText.textContent = 'Iniciar Sesión como Socio';
            } else if (rol === 'Cliente') {
                identificadorLabel.textContent = 'NÚM. DE SOCIO';
                if (rolIcon) rolIcon.innerHTML = '<i class="fa-solid fa-user"></i>';
                identificadorInput.type = 'number';
                identificadorInput.min = '1';
                identificadorInput.placeholder = '';
                identificadorInput.value = '';
                identificadorIcon.innerHTML = '<i class="fa-solid fa-handshake"></i>';

                passwordContainer.classList.add('hidden');
                passwordInput.required = false;
                passwordInput.value = '';

                btnText.textContent = 'Acceder al Catálogo como Cliente';
            }
        }

        rolLogin.addEventListener('change', actualizarCamposPorRol);
        actualizarCamposPorRol();

        // Alternar Visibilidad de Contraseña
        window.togglePasswordVisibility = function(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            const openIcon = btn.querySelector('.eye-open');
            const closedIcon = btn.querySelector('.eye-closed');
            if (openIcon && closedIcon) {
                openIcon.classList.toggle('hidden', isPass);
                closedIcon.classList.toggle('hidden', !isPass);
            }
        };

        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener('click', (e) => {
                e.preventDefault();
                togglePasswordVisibility('password', togglePasswordBtn);
            });
        }

        // Función Auxiliar para Mostrar Alertas
        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-200', 'bg-[#C5DB9E]/40', 'text-[#195618]', 'border-[#88BD79]', 'bg-[#A8C1A0]/30', 'border-[#93A981]', 'border');
            
            if (type === 'success') {
                alertBox.classList.add('bg-[#C5DB9E]/40', 'text-[#195618]', 'border', 'border-[#88BD79]');
                alertIcon.className = 'fa-solid fa-circle-check text-[#195618] text-sm flex-shrink-0';
            } else if (type === 'info') {
                alertBox.classList.add('bg-[#A8C1A0]/30', 'text-[#195618]', 'border', 'border-[#93A981]');
                alertIcon.className = 'fa-solid fa-circle-info text-[#5C8754] text-sm flex-shrink-0';
            } else {
                alertBox.classList.add('bg-rose-50', 'text-rose-700', 'border', 'border-rose-200');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-rose-600 text-sm flex-shrink-0';
            }

            alertMessage.textContent = msg;
        }

        // Estado de Carga en Botón
        function setLoading(loading) {
            if (loading) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Verificando...';
                btnIcon.classList.add('hidden');
                btnSpinner.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                actualizarCamposPorRol();
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }

        // Envío del Formulario e Integración con /api/login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const tipo_acceso = rolLogin.value;
            const identificador = identificadorInput.value.trim();
            const password = passwordInput.value;

            if (!identificador) {
                showAlert('Por favor completa el campo de identificación.');
                return;
            }

            if (tipo_acceso !== 'Cliente' && !password) {
                showAlert('Por favor ingresa tu contraseña.');
                return;
            }

            setLoading(true);

            // Determinar endpoint (soporta apertura tanto por http://localhost:3000 como por file:///)
            const apiBase = window.location.protocol.startsWith('http') ? '' : 'http://localhost:3000';

            try {
                const response = await fetch(`${apiBase}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo_acceso, identificador, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.user) {
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                    }
                    showAlert(data.message || '¡Acceso concedido! Redirigiendo...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard.html';
                    }, 600);
                } else {
                    setLoading(false);
                    showAlert(data.message || 'Credenciales o Número de Socio inválido.');
                }
            } catch (error) {
                console.warn('Conexión con backend falló, evaluando credenciales offline:', error);

                // Soporte offline para pruebas locales si el servidor se encuentra reiniciando
                if (tipo_acceso === 'Administrador' && (identificador.toLowerCase() === 'admin' || identificador.toLowerCase() === 'admin@localmarket.com') && (password === '1234' || password === '123' || password.toLowerCase() === 'admin')) {
                    const fallbackUser = { id_usuario: 1, id_rol: 1, nombre: 'Administrador', correo: 'admin@localmarket.com', rol: 'Administrador', nombre_rol: 'Administrador', numero_socio: null, foto_perfil: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=120' };
                    localStorage.setItem('currentUser', JSON.stringify(fallbackUser));
                    showAlert('¡Inicio de sesión como Administrador (Modo Offline)!', 'success');
                    setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
                    return;
                }

                if (tipo_acceso === 'Socio' && (identificador === '1' || identificador === '2') && (password === '4321' || password === '1234')) {
                    const fallbackUser = { id_usuario: 2, id_rol: 2, nombre: 'Gisela', correo: 'ar230111983@arandas.tecmm.edu.mx', rol: 'Socio', nombre_rol: 'Socio', numero_socio: 1, telefono_socio: '3471046625', foto_perfil: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120' };
                    localStorage.setItem('currentUser', JSON.stringify(fallbackUser));
                    showAlert('¡Inicio de sesión como Socio #1 (Modo Offline)!', 'success');
                    setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
                    return;
                }

                if (tipo_acceso === 'Cliente' && (identificador === '1' || identificador === '2')) {
                    const fallbackUser = { id_usuario: 9001, nombre: 'Cliente del Socio #1', rol: 'Cliente', nombre_rol: 'Cliente', numero_socio: 1, nombre_socio: 'Gisela', telefono_socio: '3471046625', foto_perfil: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=80' };
                    localStorage.setItem('currentUser', JSON.stringify(fallbackUser));
                    showAlert('¡Acceso concedido como Cliente del Socio #1 (Modo Offline)!', 'success');
                    setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
                    return;
                }

                setLoading(false);
                showAlert('Error de comunicación con el servidor. Verifica que el servidor en http://localhost:3000 esté activo.');
            }
        });
    </script>
    <script src="js/pwa.js"></script>
</body>
</html>
