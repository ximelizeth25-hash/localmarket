<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LocalMarket</title>
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LocalMarket">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d'
                        },
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .ambient-glow {
            background: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.12), transparent 45%),
                        radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.08), transparent 40%);
        }
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .card-pop {
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 ambient-glow flex flex-col justify-center items-center p-4 sm:p-6 text-slate-800 antialiased relative selection:bg-sky-500 selection:text-white">

    <!-- Tarjeta Principal de Login -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-slate-200/70 border border-slate-200/80 p-8 sm:p-10 card-pop relative overflow-hidden z-10">
        
        <!-- Acento decorativo superior -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-sky-500 via-emerald-400 to-cyan-500"></div>

        <!-- Encabezado / Branding -->
        <div class="text-center space-y-3 mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-600 via-cyan-500 to-emerald-400 items-center justify-center text-white shadow-lg shadow-sky-500/25 mb-1 transform hover:scale-105 transition-all">
                <i class="fa-solid fa-store text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                    Local<span class="text-sky-600">Market</span>
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 font-medium mt-1">
                    Bienvenido
                </p>
            </div>
        </div>

        <!-- Mensaje de Retroalimentación (Alerta) -->
        <div id="alertBox" class="hidden mb-6 p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2.5 transition-all duration-300">
            <i id="alertIcon" class="fa-solid text-sm flex-shrink-0"></i>
            <span id="alertMessage" class="flex-1 leading-snug"></span>
        </div>

        <!-- Formulario de Acceso -->
        <form id="loginForm" class="space-y-4">
            
            <!-- Campo: Usuario / Correo -->
            <div class="relative flex items-center">
                <span class="absolute left-3.5 text-slate-400 text-sm">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    class="w-full pl-10 pr-4 py-3 text-sm rounded-xl border border-slate-300 bg-slate-50/50 hover:bg-white focus:bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all font-medium"
                >
            </div>

            <!-- Campo: Contraseña con Toggle de Visibilidad -->
            <div class="relative flex items-center">
                <span class="absolute left-3.5 text-slate-400 text-sm">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    class="w-full pl-10 pr-11 py-3 text-sm rounded-xl border border-slate-300 bg-slate-50/50 hover:bg-white focus:bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all font-medium"
                >
                <button 
                    type="button" 
                    id="togglePasswordBtn" 
                    title="Mostrar u ocultar contraseña"
                    class="absolute right-3 text-slate-400 hover:text-slate-700 p-1 rounded-lg focus:outline-none transition-all"
                >
                    <i id="toggleEyeIcon" class="fa-solid fa-eye text-sm"></i>
                </button>
            </div>

            <!-- Botón de Envío -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-slate-900 hover:bg-sky-600 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl text-sm transition-all duration-200 shadow-lg shadow-slate-900/10 hover:shadow-sky-500/25 flex items-center justify-center space-x-2 cursor-pointer mt-2"
            >
                <span id="btnText">Iniciar Sesión</span>
                <i id="btnIcon" class="fa-solid fa-arrow-right text-xs"></i>
                <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

    </div>

    <!-- Footer Copyright -->
    <p class="text-xs text-slate-400 mt-6 text-center font-medium">
        &copy; 2026 LocalMarket &bull; Sistema de Gestión y Comercio Electrónico
    </p>

    <!-- Script de Lógica Frontend & Backend -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const toggleEyeIcon = document.getElementById('toggleEyeIcon');
        const alertBox = document.getElementById('alertBox');
        const alertIcon = document.getElementById('alertIcon');
        const alertMessage = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        // Alternar Visibilidad de Contraseña
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleEyeIcon.className = isPassword ? 'fa-solid fa-eye-slash text-sm' : 'fa-solid fa-eye text-sm';
        });

        // Función Auxiliar para Mostrar Alertas
        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200', 'bg-sky-50', 'text-sky-700', 'border-sky-200');
            
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
                alertIcon.className = 'fa-solid fa-circle-check text-emerald-600 text-sm flex-shrink-0';
            } else if (type === 'info') {
                alertBox.classList.add('bg-sky-50', 'text-sky-700', 'border', 'border-sky-200');
                alertIcon.className = 'fa-solid fa-circle-info text-sky-600 text-sm flex-shrink-0';
            } else {
                alertBox.classList.add('bg-rose-50', 'text-rose-700', 'border', 'border-rose-200');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-rose-600 text-sm flex-shrink-0';
            }

            alertMessage.textContent = msg;
        }

        // Estado de Carga en Botón
        function setLoading(loading) {
            if (loading) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Verificando...';
                btnIcon.classList.add('hidden');
                btnSpinner.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Iniciar Sesión';
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }

        // Envío del Formulario e Integración con /api/login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            setLoading(true);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.user) {
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                    } else {
                        localStorage.setItem('currentUser', JSON.stringify({ nombre: username, nombre_rol: 'Administrador' }));
                    }
                    showAlert('¡Inicio de sesión exitoso! Redirigiendo al panel...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard.html';
                    }, 600);
                } else {
                    setLoading(false);
                    showAlert(data.message || 'Credenciales inválidas. Verifica tu usuario o contraseña.');
                }
            } catch (error) {
                setLoading(false);
                showAlert('Error de comunicación con el servidor. Intenta de nuevo.');
            }
        });
    </script>
    <script src="js/pwa.js"></script>
</body>
</html>
